{%- assign social = site.minima.social_links -%}
{%- if social -%}
<ul class="social-media-list">
  {%- if social.github -%}

    <a rel="me" href="https://github.com/{{ social.github | escape }}" target="_blank" title="GitHub">

      <span class="username">{{ social.github | escape }}</span>
    </a>
  </li>
  {%- endif -%}
  {%- if social.linkedin -%}
  <li>
    <a rel="me" href="{{ social.linkedin }}" target="_blank" title="LinkedIn">
      <svg class="svg-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M13.632 13.635h-2.37V9.922c0-.886-.018-2.025-1.234-2.025-1.235 0-1.424.964-1.424 1.96v3.778h-2.37V6h2.275v1.04h.03c.318-.6 1.092-1.233 2.247-1.233 2.4 0 2.846 1.58 2.846 3.637v4.19zM3.558 4.955a1.376 1.376 0 1 1 .001-2.751 1.376 1.376 0 0 1 0 2.75zm1.188 8.68H2.37V6h2.376v7.635zM14.816 0H1.18C.528 0 0 .516 0 1.153v13.694C0 15.484.528 16 1.18 16h13.635c.652 0 1.185-.516 1.185-1.153V1.153C16 .516 15.467 0 14.815 0z"/></svg>
      <span class="username">LinkedIn</span>
    </a>
  </li>
  {%- endif -%}
  {%- if social.email -%}
  <li>
    <a rel="me" href="mailto:{{ social.email }}" title="Email">
      <svg class="svg-icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M0 4v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H2a2 2 0 0 0-2 2zm14.06-.5L8 9.56 1.94 3.5h12.12zM1 4.5l7 7 7-7V12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4.5z"/></svg>
      <span class="username">{{ social.email }}</span>
    </a>
  </li>
  {%- endif -%}
</ul>
{%- endif -%}
