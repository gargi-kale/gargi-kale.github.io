<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper footer-inner">
    <p class="footer-meta">
      &copy; {{ site.time | date: "%Y" }} {{ site.author.name | default: site.title | escape }}
      {%- if site.author.email %} &middot; <a class="u-email" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>{%- endif -%}
    </p>

    <div class="footer-social">
      {%- include social.html -%}
    </div>
  </div>
</footer>
